<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptMe</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 1.25rem;
      line-height: 2rem;
      overflow: hidden;
    }
    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0.75rem;
      background-color: #111;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
    }
    #controls-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    #controls button {
      background: #444;
      color: white;
      border: none;
      padding: 0.3rem 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #controls button:hover {
      background: #666;
    }
    .info-icon {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      border: 2px solid white;
      text-align: center;
      line-height: 0.9rem;
      font-size: 0.8rem;
      position: relative;
    }
    .info-icon:hover::after {
      content: "Paste text below. Use arrows or PgUp/PgDn to scroll. Adjust size with A- / A+. Offline capable.";
      position: absolute;
      top: 50%;
      left: 125%;
      transform: translateY(-50%);
      background-color: #222;
      color: white;
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: nowrap;
      z-index: 999;
    }
    #teleprompter {
      height: calc(100vh - 44px);
      overflow-y: auto;
      padding: 2rem;
      -webkit-overflow-scrolling: auto;
    }
    .content {
      max-width: 800px;
      margin: auto;
    }
    .editable {
      outline: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div id="controls-left">
      <strong>PromptMe</strong>
      <span class="info-icon">i</span>
    </div>
    <div>
      <button onclick="adjustFontSize(-0.2)">A-</button>
      <button onclick="adjustFontSize(0.2)">A+</button>
    </div>
  </div>
  <div id="teleprompter">
    <div class="content editable" id="scriptContent" contenteditable="true">
      <p>Click here and paste your script. You can edit it live. Scroll using Page Up/Down or Arrow Up/Down.</p>
    </div>
  </div>
  <script>
    const scriptContent = document.getElementById('scriptContent');
    let currentFontSize = 1.25;
    let currentLineHeight = 2;

    document.addEventListener('keydown', function(e) {
      const container = document.getElementById('teleprompter');
      const scrollAmount = 20;
      if (["PageUp", "ArrowUp"].includes(e.code)) {
        container.scrollBy({ top: -scrollAmount, behavior: 'smooth' });
        e.preventDefault();
      } else if (["PageDown", "ArrowDown"].includes(e.code)) {
        container.scrollBy({ top: scrollAmount, behavior: 'smooth' });
        e.preventDefault();
      }
    });

    function adjustFontSize(delta) {
      currentFontSize = Math.max(1, currentFontSize + delta);
      currentLineHeight = currentFontSize * 1.5;
      document.body.style.fontSize = currentFontSize + 'rem';
      document.body.style.lineHeight = currentLineHeight + 'rem';
    }
  </script>
</body>
</html>
